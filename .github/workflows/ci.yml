name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix formatting and block unformatted revisions
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pnpm run format
          if git diff --quiet; then
            exit 0
          fi
          git diff
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$HEAD_BRANCH" != main ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: apply Prettier formatting'
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi
          echo "::error::Formatting was repaired locally or pushed to the PR branch. Check the corrected revision before running tests."
          exit 1

  test:
    needs: format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up Linux workspace isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / -- /usr/bin/prlimit -- /bin/true
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Node tests
        run: pnpm run test:node
        env:
          MINI_HARNESS_REQUIRE_ISOLATION: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Verify the installed npm package
        run: pnpm run pack:verify

  browser-linux:
    needs: format
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned official image contains Chromium Headless Shell and system dependencies.
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Playwright tests
        run: pnpm run test:playwright
      - name: Verify third-party plugins in the installed browser runtime
        run: pnpm run pack:verify --browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details-ubuntu-24.04
          path: test-results/
          retention-days: 7

  browser-windows:
    needs: format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Do not enable Media Foundation: the Chromium Headless Shell tests do not use media APIs.
      - run: pnpm exec playwright install chromium --only-shell
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Playwright tests
        run: pnpm run test:playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details-windows-latest
          path: test-results/
          retention-days: 7
