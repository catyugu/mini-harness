name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  test:
    needs: format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Node tests
        run: pnpm run test:node

  browser-linux:
    needs: format
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned official image contains Chromium Headless Shell and system dependencies.
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Playwright tests
        run: pnpm run test:playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details-ubuntu-24.04
          path: test-results/
          retention-days: 7

  browser-windows:
    needs: format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Do not enable Media Foundation: the Chromium Headless Shell tests do not use media APIs.
      - run: pnpm exec playwright install chromium --only-shell
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Playwright tests
        run: pnpm run test:playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details-windows-latest
          path: test-results/
          retention-days: 7

  third-party-plugins-linux:
    needs: format
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned official image contains Chromium Headless Shell and system dependencies.
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Verify third-party plugins from the installed npm package
        run: pnpm run pack:verify --browser

  third-party-plugins-windows:
    needs: format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --only-shell
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Verify third-party plugins from the installed npm package
        run: pnpm run pack:verify --browser
