name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        if: runner.os == 'Linux' && matrix.node == '24'
        continue-on-error: true
        run: |
          pnpm run format:check || {
            pnpm run format
            node --input-type=module -e 'import { execFileSync } from "node:child_process"; import { readFileSync } from "node:fs"; for (const path of execFileSync("git", ["diff", "--name-only", "-z"], {encoding:"utf8"}).split("\0").filter(Boolean)) { const content = readFileSync(path, "utf8"); const count = Math.ceil(content.length / 3000); for (let i=0; i<count; i++) console.log("FORMAT_CHUNK " + JSON.stringify({path,i,count,content:content.slice(i*3000,(i+1)*3000)})); }'
            git restore .
            exit 1
          }
      - name: Set up Linux workspace isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / -- /usr/bin/prlimit -- /bin/true
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Node tests
        run: pnpm run test:node
        env:
          MINI_HARNESS_REQUIRE_ISOLATION: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Verify the installed npm package
        run: pnpm run pack:verify

  browser-linux:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned official image contains Chromium Headless Shell and system dependencies.
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Playwright tests
        run: pnpm run test:playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details-ubuntu-24.04
          path: test-results/
          retention-days: 7

  browser-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Do not enable Media Foundation: the Chromium Headless Shell tests do not use media APIs.
      - run: pnpm exec playwright install chromium --only-shell
      - name: Build with strict TypeScript
        run: pnpm run build
      - name: Run Playwright tests
        run: pnpm run test:playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details-windows-latest
          path: test-results/
          retention-days: 7
