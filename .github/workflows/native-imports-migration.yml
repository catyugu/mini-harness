name: Temporary native module import migration
on:
  push:
    branches: [fix/pack-shell-auth-run-ui]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Convert imports without altering strict TypeScript
        run: node .github/native-imports-migration.mjs
      - name: Verify strict types and the complete native Node test suite
        run: |
          pnpm run typecheck
          pnpm run build
          node dist/scripts/run-node-tests.js
      - name: Commit and remove all temporary migration infrastructure
        run: |
          git rm -f .github/native-imports-migration.mjs
          git rm -f .github/workflows/native-imports-migration.yml
          git rm -f scripts/resolve-imports.mjs
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: use native Node package imports and browser import maps"
          git push origin HEAD:fix/pack-shell-auth-run-ui
