name: Temporary strict migration writer
on:
  push:
    branches: [fix/pack-shell-auth-run-ui]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify strict TypeScript migration
        run: node .github/strict-migration-apply.mjs
      - name: Commit complete strict migration and remove temporary bridge
        run: |
          git rm -f .github/workflows/strict-migration-bridge.yml
          git rm -f .github/strict-migration-apply.mjs
          git rm -r -f .github/strict-payload/
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: eliminate all strict TypeScript errors without suppressions"
          git push origin HEAD:fix/pack-shell-auth-run-ui
