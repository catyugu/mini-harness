name: Autofix
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  autofix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format
      - run: pnpm run format:check
      - name: Commit and push formatting changes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.FORMAT_AUTOFIX_TOKEN }}
        run: |
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure the FORMAT_AUTOFIX_TOKEN Actions secret to enable automatic CI after writeback.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style: apply Prettier formatting"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$HEAD_REF"
